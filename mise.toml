# Tool versions for local work and CI (jdx/mise-action reads this file).
# Run `mise install` once, then `mise run <task>`; `mise tasks` lists them.
[tools]
go = "1.26.8"
pack = "0.40.9"
golangci-lint = "2.15.0"
shellcheck = "0.11.0"
actionlint = "1.7.12"
# Release pipeline: push .cnb files as OCI artifacts, sign, resolve digests.
oras = "1.3.5"
cosign = "3.1.3"
crane = "0.22.1"

[tasks.lint]
description = "Static checks: golangci-lint, shellcheck, actionlint"
run = [
  "golangci-lint run ./...",
  "shellcheck scripts/*.sh",
  "actionlint",
]

[tasks.test]
description = "Unit tests with the race detector"
run = "go test -race -count=1 ./..."

[tasks.stack]
description = "Build the build, run and run-distroless images into the local daemon"
run = """
v=$(cat VERSION)
for img in build run run-distroless; do
  docker build -f stack/$img.Dockerfile -t ghcr.io/taha2samy-3/fck-fips/$img:$v stack/
done
"""

[tasks.package]
description = "Package every buildpack and create the builder locally"
# pack leaves large temp dirs behind; keep them off a small tmpfs /tmp.
env = { TMPDIR = "{{config_root}}/.cache/tmp" }
run = "mkdir -p \"$TMPDIR\" && ./scripts/package.sh"

[tasks.integration]
description = "Build and run the testdata apps with the local builder"
depends = ["stack", "package"]
env = { TMPDIR = "{{config_root}}/.cache/tmp" }
run = "mkdir -p \"$TMPDIR\" && go test -tags integration -v -count=1 -timeout 60m ./integration"
