name: Release

# Only a pushed tag vX.Y.Z releases, and only if CHANGELOG.md has a
# "## [X.Y.Z]" section, which becomes the release notes. It publishes to GHCR as signed OCI artifacts:
#   ghcr.io/<owner>/fck-fips/<buildpack>:X.Y.Z                    buildpackages
#   ghcr.io/<owner>/fck-fips/builder-nodejs:X.Y.Z                 builder
#   ghcr.io/<owner>/fck-fips/cnb/<buildpack>:X.Y.Z                .cnb files (oras)
# Every digest is signed with cosign (keyless), gets SLSA v1.0 Build L3
# provenance from slsa-github-generator and a GitHub build attestation; the
# .cnb files and SHA256SUMS are attached to the GitHub release.
#
# The stack images (build, run, run-distroless) are not built here: stack.yml
# publishes them on their own schedule, and the builder uses their :latest
# tags, so `pack rebase` moves apps to the newest run image without a release.
on:
  push:
    tags: ["v*.*.*"]

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
      id-token: write # cosign keyless signing
    outputs:
      version: ${{ steps.version.outputs.version }}
      registry: ${{ steps.version.outputs.registry }}
      node_engine_digest: ${{ steps.artifacts.outputs.node_engine_digest }}
      openssl_fips_digest: ${{ steps.artifacts.outputs.openssl_fips_digest }}
      pnpm_digest: ${{ steps.artifacts.outputs.pnpm_digest }}
      pnpm_install_digest: ${{ steps.artifacts.outputs.pnpm_install_digest }}
      nodejs_digest: ${{ steps.artifacts.outputs.nodejs_digest }}
      builder_nodejs_digest: ${{ steps.artifacts.outputs.builder_nodejs_digest }}
      cnb_node_engine_digest: ${{ steps.artifacts.outputs.cnb_node_engine_digest }}
      cnb_openssl_fips_digest: ${{ steps.artifacts.outputs.cnb_openssl_fips_digest }}
      cnb_pnpm_digest: ${{ steps.artifacts.outputs.cnb_pnpm_digest }}
      cnb_pnpm_install_digest: ${{ steps.artifacts.outputs.cnb_pnpm_install_digest }}
      cnb_nodejs_digest: ${{ steps.artifacts.outputs.cnb_nodejs_digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Version and registry
        id: version
        env:
          TAG: ${{ github.ref_name }}
          OWNER: ${{ github.repository_owner }}
        run: |
          version="${TAG#v}"
          if [[ "${version}" != "$(tr -d '[:space:]' < VERSION)" ]]; then
            echo "::error::tag ${TAG} does not match VERSION ($(cat VERSION))"
            exit 1
          fi
          # Fail before building anything if the release is undocumented.
          ./scripts/changelog.sh "${version}" > /dev/null
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "registry=ghcr.io/${OWNER,,}/fck-fips" >> "$GITHUB_OUTPUT"

      - name: Stack images are published
        env:
          REGISTRY: ${{ steps.version.outputs.registry }}
        run: |
          for img in build run run-distroless; do
            if ! digest="$(crane digest "${REGISTRY}/${img}:latest")"; then
              echo "::error::${REGISTRY}/${img}:latest is missing; run the Stack images workflow first"
              exit 1
            fi
            echo "${REGISTRY}/${img}:latest ${digest}"
          done

      - name: Buildpacks, meta buildpack and builder
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
          TMPDIR: ${{ runner.temp }}
        run: ./scripts/package.sh --publish --version "${VERSION}" --registry "${REGISTRY}"

      - name: Sign images, push .cnb artifacts
        id: artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
          REGISTRY: ${{ steps.version.outputs.registry }}
        run: ./scripts/release-artifacts.sh --version "${VERSION}" --registry "${REGISTRY}"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: |
            build/cnb/*.cnb
            build/cnb/SHA256SUMS
            build/digests.txt

  attest:
    name: Attest ${{ matrix.image }}
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      attestations: write
      packages: write
    strategy:
      matrix:
        # key: the output name prefix written by scripts/release-artifacts.sh
        include:
          - { image: node-engine, key: node_engine }
          - { image: openssl-fips, key: openssl_fips }
          - { image: pnpm, key: pnpm }
          - { image: pnpm-install, key: pnpm_install }
          - { image: nodejs, key: nodejs }
          - { image: builder-nodejs, key: builder_nodejs }
          - { image: cnb/node-engine, key: cnb_node_engine }
          - { image: cnb/openssl-fips, key: cnb_openssl_fips }
          - { image: cnb/pnpm, key: cnb_pnpm }
          - { image: cnb/pnpm-install, key: cnb_pnpm_install }
          - { image: cnb/nodejs, key: cnb_nodejs }
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ needs.publish.outputs.registry }}/${{ matrix.image }}
          subject-digest: ${{ needs.publish.outputs[format('{0}_digest', matrix.key)] }}
          push-to-registry: true

  # SLSA v1.0 Build Level 3 provenance. The generator is a reusable workflow
  # that runs isolated from the build steps above, so they cannot forge or
  # alter what it signs. It must be referenced by tag, not by commit: it
  # verifies its own ref when it runs.
  provenance:
    name: SLSA L3 ${{ matrix.image }}
    needs: publish
    permissions:
      actions: read
      id-token: write
      packages: write
    strategy:
      # The generator downloads cosign on every leg; one failed download must
      # not cancel the others, so a re-run of failed jobs is enough.
      fail-fast: false
      matrix:
        include:
          - { image: node-engine, key: node_engine }
          - { image: openssl-fips, key: openssl_fips }
          - { image: pnpm, key: pnpm }
          - { image: pnpm-install, key: pnpm_install }
          - { image: nodejs, key: nodejs }
          - { image: builder-nodejs, key: builder_nodejs }
          - { image: cnb/node-engine, key: cnb_node_engine }
          - { image: cnb/openssl-fips, key: cnb_openssl_fips }
          - { image: cnb/pnpm, key: cnb_pnpm }
          - { image: cnb/pnpm-install, key: cnb_pnpm_install }
          - { image: cnb/nodejs, key: cnb_nodejs }
    uses: slsa-framework/slsa-github-generator/.github/workflows/generator_container_slsa3.yml@v2.1.0
    with:
      image: ${{ needs.publish.outputs.registry }}/${{ matrix.image }}
      digest: ${{ needs.publish.outputs[format('{0}_digest', matrix.key)] }}
      registry-username: ${{ github.actor }}
    secrets:
      registry-password: ${{ secrets.GITHUB_TOKEN }}

  github-release:
    name: GitHub release
    needs: [publish, attest, provenance]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: release
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          REGISTRY: ${{ needs.publish.outputs.registry }}
          VERSION: ${{ needs.publish.outputs.version }}
        run: |
          {
            ./scripts/changelog.sh "${VERSION}"
            echo
            echo "## Builder"
            echo
            echo '```sh'
            echo "pack build my-app --builder ${REGISTRY}/builder-nodejs:${VERSION}"
            echo "pack build my-app --builder ${REGISTRY}/builder-nodejs:${VERSION} --env BP_OPENSSL_FIPS=true"
            echo '```'
            echo
            echo "## Digests"
            echo
            echo '```'
            cat release/digests.txt
            echo '```'
            echo
            echo "Verify the SLSA Build L3 provenance:"
            echo
            echo '```sh'
            echo "slsa-verifier verify-image ${REGISTRY}/builder-nodejs@<digest> \\"
            echo "  --source-uri github.com/${GITHUB_REPOSITORY} --source-tag ${TAG}"
            echo '```'
            echo
            echo "Verify a signature:"
            echo
            echo '```sh'
            echo "cosign verify ${REGISTRY}/builder-nodejs:${VERSION} \\"
            echo "  --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/.github/workflows/release.yml@.*' \\"
            echo "  --certificate-oidc-issuer https://token.actions.githubusercontent.com"
            echo '```'
          } > "${RUNNER_TEMP}/notes.md"
          gh release create "${TAG}" --repo "${GITHUB_REPOSITORY}" --title "${TAG}" \
            --verify-tag --notes-file "${RUNNER_TEMP}/notes.md" \
            release/cnb/*.cnb release/cnb/SHA256SUMS
