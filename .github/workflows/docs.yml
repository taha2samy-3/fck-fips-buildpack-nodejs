name: Docs

# Builds the documentation site (docs/, Astro) and publishes it to GitHub
# Pages. Pull requests only build it, so a broken page fails the check.
# The configuration reference is generated from buildpacks/*/buildpack.toml
# and the versions list from CHANGELOG.md, so changes there rebuild the site.
on:
  push:
    branches: [main]
    paths: [docs/**, buildpacks/*/buildpack.toml, VERSION, CHANGELOG.md, .github/workflows/docs.yml]
  pull_request:
    paths: [docs/**, buildpacks/*/buildpack.toml, VERSION, CHANGELOG.md, .github/workflows/docs.yml]
  workflow_dispatch:

permissions: {}

concurrency:
  group: docs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      # Gives the URL and path prefix Pages serves the site under, so asset
      # links match the repository name.
      - id: pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
        if: github.event_name != 'pull_request'
      - name: Build
        env:
          DOCS_SITE: ${{ steps.pages.outputs.origin }}
          DOCS_BASE: ${{ steps.pages.outputs.base_path }}
        run: mise run docs-build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: docs/dist

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
