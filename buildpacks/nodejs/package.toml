# Paketo buildpacks bundled into the meta buildpack. scripts/package.sh appends
# the fckfips buildpacks built from this repository.

[buildpack]
  uri = "."

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/ca-certificates:3.14.2"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/environment-variables:4.12.0"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/image-labels:4.14.3"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/node-run-script:2.3.57"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/node-start:2.7.10"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/npm-install:2.3.32"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/npm-start:2.5.10"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.4"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/tini:0.4.12"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/watchexec:3.11.3"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn:2.5.2"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn-install:2.7.26"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn-start:2.5.40"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"
