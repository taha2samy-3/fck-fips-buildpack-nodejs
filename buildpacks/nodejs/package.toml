# Paketo buildpacks bundled into the meta buildpack. scripts/package.sh appends
# the fckfips buildpacks built from this repository.

[buildpack]
  uri = "."

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/ca-certificates:3.14.4"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/environment-variables:4.12.1"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/image-labels:4.14.5"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/node-run-script:2.3.59"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/node-start:2.7.12"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/npm-install:2.3.34"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/npm-start:2.5.12"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/procfile:5.15.6"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/tini:0.4.14"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/watchexec:3.11.5"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn:2.5.4"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn-install:2.7.28"

[[dependencies]]
  uri = "docker://docker.io/paketobuildpacks/yarn-start:2.5.42"

[[targets]]
  os = "linux"
  arch = "amd64"

[[targets]]
  os = "linux"
  arch = "arm64"
