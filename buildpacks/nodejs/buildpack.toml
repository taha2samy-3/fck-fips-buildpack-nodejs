api = "0.10"

[buildpack]
  id = "fckfips/nodejs"
  name = "fck-fips Node.js"
  version = "{{VERSION}}"
  homepage = "https://github.com/taha2samy-3/fck-fips-buildpack-nodejs"
  description = "Node.js apps on Wolfi with npm, yarn or pnpm, optionally with a FIPS 140-3 validated OpenSSL module (BP_OPENSSL_FIPS=true)"
  keywords = ["nodejs", "node", "npm", "yarn", "pnpm", "wolfi", "fips"]

  [[buildpack.licenses]]
    type = "Apache-2.0"
    uri = "https://github.com/taha2samy-3/fck-fips-buildpack-nodejs/blob/main/LICENSE"

# Groups are tried in order; the first whose required buildpacks all pass wins.
# fckfips/openssl-fips passes only with BP_OPENSSL_FIPS=true, and node-engine then requires it.

# pnpm: pnpm-lock.yaml
[[order]]

  [[order.group]]
    id = "paketo-buildpacks/ca-certificates"
    version = "3.14.2"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/watchexec"
    version = "3.11.3"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/tini"
    version = "0.4.12"
    optional = true

  [[order.group]]
    id = "fckfips/openssl-fips"
    version = "{{VERSION}}"
    optional = true

  [[order.group]]
    id = "fckfips/node-engine"
    version = "{{VERSION}}"

  [[order.group]]
    id = "fckfips/pnpm"
    version = "{{VERSION}}"

  [[order.group]]
    id = "fckfips/pnpm-install"
    version = "{{VERSION}}"

  [[order.group]]
    id = "paketo-buildpacks/node-run-script"
    version = "2.3.57"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/node-start"
    version = "2.7.10"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/npm-start"
    version = "2.5.10"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/procfile"
    version = "5.15.4"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/environment-variables"
    version = "4.12.0"
    optional = true

  [[order.group]]
    id = "paketo-buildpacks/image-labels"
    version = "4.14.3"
    optional = true

